# Python reference implementation for Ampelum.ComparativeBenchmarks.
#
# uv-managed project. The C# side (PythonDspyRunner) prefers `uv run python`
# when uv is on PATH so this file's pins are honoured deterministically; the
# bare-`python` fallback uses requirements.txt with the same pins.
#
# This folder is the ONLY place the upstream Python framework name appears. The alpha.6
# grep gate explicitly allowlists this directory.

[project]
name = "ampelum-comparative-pyref"
version = "0.9.1a5"
description = "Python reference runner for Ampelum.ComparativeBenchmarks (subprocess harness target)."
requires-python = ">=3.12"
dependencies = [
    "dspy-ai==2.5.43",
    "pydantic>=2.7,<3.0",
    "tiktoken>=0.7.0,<1.0",
    "psutil>=5.9,<7.0",
]

[tool.uv]
package = false

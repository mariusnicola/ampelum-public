name: pareto-integration

# Runs the 19 Pareto integration tests against a real LM endpoint
# (OpenRouter). Triggered:
#   * nightly schedule
#   * PR with 'integration-required' label
#   * manual dispatch
#
# The AMPELUM_INTEGRATION_OPENROUTER_KEY secret unlocks the real-LM tests;
# without it the suite's Skip predicates emit Skip outcomes (no failure).
# AOT-binary tests (Pareto19) require AMPELUM_AOT_PROBE_PATH which the
# workflow publishes ahead of the test run.

on:
  schedule:
    - cron: '15 4 * * *'   # 04:15 UTC nightly (after comparative-nightly)
  pull_request:
    types: [labeled]
  workflow_dispatch:

jobs:
  pareto:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'integration-required')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AMPELUM_INTEGRATION_OPENROUTER_KEY: ${{ secrets.AMPELUM_INTEGRATION_OPENROUTER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }

      - name: Restore + build (Release)
        run: |
          dotnet restore tests/Ampelum.IntegrationTests/Ampelum.IntegrationTests.csproj
          dotnet build  tests/Ampelum.IntegrationTests/Ampelum.IntegrationTests.csproj -c Release --no-restore

      - name: Publish AotSmoke (linux-x64) for Pareto19
        run: |
          dotnet publish tests/Ampelum.AotSmoke -c Release -r linux-x64 --self-contained true \
            -o artifacts/aot-smoke

      - name: Run Pareto integration tests
        env:
          AMPELUM_AOT_PROBE_PATH: ${{ github.workspace }}/artifacts/aot-smoke/Ampelum.AotSmoke
        run: |
          dotnet test tests/Ampelum.IntegrationTests/Ampelum.IntegrationTests.csproj \
            -c Release --no-build \
            --logger "trx;LogFileName=pareto.trx" \
            --logger "console;verbosity=normal"

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pareto-trx
          path: '**/TestResults/*.trx'
          retention-days: 30

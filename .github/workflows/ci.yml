name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      # Unit tests only. These classes need a running Ollama, a PostgreSQL
      # database or a packed nupkg.
      - run: >
          dotnet test -c Release --no-build
          --filter "FullyQualifiedName!~OllamaLiveTests&FullyQualifiedName!~PostgresWorkflowPersistenceTests&FullyQualifiedName!~Analyzers.Tests.PackagingTests"

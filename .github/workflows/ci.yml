name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  rebrand-grep-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Fail if any DSPy.Net / dspy reference remains (excludes DSPy-py competitor refs)
        run: |
          set -e
          MATCHES=$(rg -n --pcre2 '\b(?i:dspy(\.net)?|dspy_net)\b(?!-py)' \
            --glob '!**/bin/**' --glob '!**/obj/**' \
            --glob '!BenchmarkDotNet.Artifacts/**' --glob '!TestResults/**' \
            --glob '!docs/superpowers/plans/2026-04-2[2-5]-dspy-net-*.md' \
            --glob '!docs/superpowers/specs/2026-04-2[2-5]-dspy-net-*.md' \
            --glob '!docs/superpowers/plans/2026-04-25-v0.8-atomic-rebrand.md' \
            --glob '!docs/benchmarks/2026-04-22-*.md' \
            --glob '!docs/performance/2026-04-22-*.md' \
            --glob '!docs/reviews/2026-04-22-*.md' \
            --glob '!docs/quality/stryker-baseline.md' \
            --glob '!CHANGELOG.md' \
            --glob '!docs/migration/**' \
            --glob '!src/Ampelum.Tools.WebSearch/README.md' \
            --glob '!src/Ampelum/Optimizers/GEPAOptimizer.cs' \
            --glob '!tests/Ampelum.ComparativeBenchmarks/**' \
            --glob '!tests/Ampelum.ContractTests/OllamaLiveTests.cs' \
            || true)
          if [ -n "$MATCHES" ]; then
            echo "DSPy.Net / dspy references found post-rebrand:"
            echo "$MATCHES"
            exit 1
          fi
          echo "Rebrand grep gate passed."

  build:
    needs: rebrand-grep-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      # Gate Ampelum core coverage: Ampelum.Tests exercises every line of
      # the Ampelum assembly at 100%. ContractTests is an integration suite
      # and is run WITHOUT a coverage gate, redundant coverage on Ampelum
      # is already enforced above.
      # PSQ (v0.6c): branch threshold dropped to line-only because span /
      # Utf8JsonReader switch logic produces compiler-inserted unreachable
      # branches that cannot be exercised from C#.
      - run: >
          dotnet test tests/Ampelum.Tests/Ampelum.Tests.csproj
          -c Release --no-build
          -p:CollectCoverage=true
          -p:CoverletOutputFormat=cobertura
          -p:Threshold=100
          -p:ThresholdType=line
          -p:ThresholdStat=total
          -p:Include="[Ampelum]*"
          -p:ExcludeByFile="**/*.g.cs,**/WebSocketTransport.cs"
      - run: dotnet test tests/Ampelum.ContractTests/Ampelum.ContractTests.csproj -c Release --no-build --filter "FullyQualifiedName!~OllamaLiveTests"
      # Gate Ampelum.Testing coverage: Testing.Tests must reach 100% on Ampelum.Testing only.
      - run: >
          dotnet test tests/Ampelum.Testing.Tests/Ampelum.Testing.Tests.csproj
          -c Release --no-build
          -p:CollectCoverage=true
          -p:CoverletOutputFormat=cobertura
          -p:Threshold=100
          -p:ThresholdType=line
          -p:ThresholdStat=total
          -p:Include="[Ampelum.Testing]*"
      # Gate Ampelum.Mcp coverage: Mcp.Tests must reach 100% on Ampelum.Mcp only.
      - run: >
          dotnet test tests/Ampelum.Mcp.Tests/Ampelum.Mcp.Tests.csproj
          -c Release --no-build
          -p:CollectCoverage=true
          -p:CoverletOutputFormat=cobertura
          -p:Threshold=100
          -p:ThresholdType=line,branch
          -p:ThresholdStat=total
          -p:Include="[Ampelum.Mcp]*"
      # Gate Ampelum.SourceGenerator coverage: SourceGenerator.Tests must reach 100% on Ampelum.SourceGenerator only.
      - run: >
          dotnet test tests/Ampelum.SourceGenerator.Tests/Ampelum.SourceGenerator.Tests.csproj
          -c Release --no-build
          -p:CollectCoverage=true
          -p:CoverletOutputFormat=cobertura
          -p:Threshold=100
          -p:ThresholdType=line,branch
          -p:ThresholdStat=total
          -p:Include="[Ampelum.SourceGenerator]*"
      # Host Plan 4.20: Gate SignalGrid.Ampelum.Host coverage at 90% line.
      - run: >
          dotnet test tests/SignalGrid.Ampelum.Host.Tests/SignalGrid.Ampelum.Host.Tests.csproj
          -c Release --no-build
          -p:CollectCoverage=true
          -p:CoverletOutputFormat=cobertura
          -p:Threshold=90
          -p:ThresholdType=line
          -p:ThresholdStat=total
          -p:Include="[SignalGrid.Ampelum.Host]*"
          -p:ExcludeByFile="**/*.g.cs"

  benchmark-gate:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Install dotnet-script
        run: dotnet tool install -g dotnet-script
      - name: Build benchmarks (Release)
        run: dotnet build tests/Ampelum.Benchmarks/Ampelum.Benchmarks.csproj -c Release
      - name: Run gated benchmarks
        run: >
          dotnet run --no-build -c Release
          --project tests/Ampelum.Benchmarks
          --
          --filter "*Gate*"
          --exporters json
      - name: Parse benchmark results against gates
        run: >
          dotnet script tests/Ampelum.Benchmarks/scripts/parse-gate.csx --
          BenchmarkDotNet.Artifacts/results
          tests/Ampelum.Benchmarks/scripts/gate-thresholds.json
      - name: Upload BenchmarkDotNet artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/

  aot-smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Publish AOT smoke
        run: >
          dotnet publish tests/Ampelum.AotSmoke/Ampelum.AotSmoke.csproj
          -c Release -r linux-x64
          -o ${{ runner.temp }}/aotpub
      - name: Run published binary
        run: ${{ runner.temp }}/aotpub/Ampelum.AotSmoke

  # v0.7 Task 11a: per-PR Windows job. Mirrors the Linux build's
  # gated suites without coverage thresholds (those are authoritative on linux).
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test tests/Ampelum.Tests/Ampelum.Tests.csproj -c Release --no-build
      - run: dotnet test tests/Ampelum.Testing.Tests/Ampelum.Testing.Tests.csproj -c Release --no-build
      - run: dotnet test tests/Ampelum.Mcp.Tests/Ampelum.Mcp.Tests.csproj -c Release --no-build
      - run: dotnet test tests/Ampelum.SourceGenerator.Tests/Ampelum.SourceGenerator.Tests.csproj -c Release --no-build
      - run: dotnet test tests/SignalGrid.Ampelum.Host.Tests/SignalGrid.Ampelum.Host.Tests.csproj -c Release --no-build
      - name: Publish AOT smoke (win-x64)
        run: >
          dotnet publish tests/Ampelum.AotSmoke/Ampelum.AotSmoke.csproj
          -c Release -r win-x64
          -o ${{ runner.temp }}/aotpub
      - name: Run AOT smoke binary
        shell: bash
        run: ${{ runner.temp }}/aotpub/Ampelum.AotSmoke.exe

  # v0.7 Task 11b: linux-arm64 build via QEMU on push-to-main only.
  # Wall-clock ~30 min; gated on push to main per PSQ-5 to avoid
  # blocking PRs.
  build-arm64:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu22.04
          install: |
            apt-get update -q -y
            apt-get install -y wget ca-certificates
            wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
            chmod +x dotnet-install.sh
            ./dotnet-install.sh --version 10.0.201 --install-dir /usr/share/dotnet
            ln -s /usr/share/dotnet/dotnet /usr/local/bin/dotnet
          run: |
            dotnet restore
            dotnet build -c Release --no-restore
            dotnet test tests/Ampelum.Tests/Ampelum.Tests.csproj -c Release --no-build

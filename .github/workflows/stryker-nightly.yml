name: Stryker Nightly
on:
  schedule:
    # 03:00 UTC nightly — keeps mutation runs off the critical PR path.
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  mutation:
    runs-on: ubuntu-latest
    # v0.7 deferral: kill-score gate is informational only (`break: 0` in
    # stryker-config.json). Build is never failed by mutation results during
    # v0.7. The v1-decisions.md §E1 85% target lands as an enforced gate in
    # v0.9.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Restore tool manifest
        run: dotnet tool restore
      - name: Restore + build (Release)
        run: |
          dotnet restore
          dotnet build -c Release --no-restore
      - name: Run Stryker (scoped to Optimizers/Audit/Hooks)
        run: dotnet stryker --config-file stryker-config.json
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-mutation-report
          path: StrykerOutput/
          retention-days: 14

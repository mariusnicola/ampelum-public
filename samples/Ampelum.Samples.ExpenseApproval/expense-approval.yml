id: expense-approval
version: 1.0.0
name: Expense approval
objective:
  metrics:
    - id: receipt_matches
      direction: maximize
      threshold: 1
evaluation:
  metrics: [receipt_matches]
risk:
  max_effect_class: additive
steps:
  - id: extract
    kind: sequential
  - id: route
    kind: branch
    depends_on: [extract]
    branch_targets: [pay, review]
    inputs:
      limit: "500"
  - id: pay
    kind: tool
    tool: pay_expense
    depends_on: [route]
    effect: additive
    tool_allow_list: [pay_expense]
    compensation_step: refund
  - id: review
    kind: tool
    tool: flag_for_review
    depends_on: [route]
    effect: additive
    tool_allow_list: [flag_for_review]
  - id: done
    kind: join
    depends_on: [pay, review]
  - id: receipt
    kind: wait_for_signal
    depends_on: [done]
    inputs:
      signal: receipt
  - id: check
    kind: evaluate
    depends_on: [receipt, extract]
  - id: announce
    kind: emit_event
    depends_on: [check]
    inputs:
      event: expense.settled
      detail: The receipt matches the expense.
  - id: refund
    kind: compensate
